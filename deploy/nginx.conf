# /etc/nginx/sites-available/pze
# The site is static files. One fixed origin, https://point08.health: device storage is per origin,
# so every other way of reaching the server (the bare IP included) is redirected to it.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  location /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 301 https://point08.health$request_uri; }
}

# The old address. Its certificate is for the IP, so the redirect happens without a warning.
server {
  listen 443 ssl http2 default_server;
  listen [::]:443 ssl http2 default_server;
  server_name 129.212.216.42;

  ssl_certificate /etc/letsencrypt/live/pze/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pze/privkey.pem;

  return 301 https://point08.health$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name point08.health;

  ssl_certificate /etc/letsencrypt/live/point08.health/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/point08.health/privkey.pem;

  root /var/www/pze;
  index index.html;
  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  # Hashed build files never change.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # Pages are always revalidated, so a fix reaches phones on the next open.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html $uri/index.html =404;
  }
}
